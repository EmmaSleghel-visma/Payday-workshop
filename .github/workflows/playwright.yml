name: Playwright tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # Machine-readable results, so a later step (or an agent) can summarise them.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: results-json
          path: results.json
          retention-days: 14
